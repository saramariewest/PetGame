spring.main.web-application-type=none
spring.main.headless=false

# Set these values as environment variables. Do not commit credentials to Git.
spring.datasource.url=${PETGAME_DB_URL:jdbc:mysql://localhost:3306/petgame?serverTimezone=Europe/Berlin}
spring.datasource.username=${PETGAME_DB_USERNAME}
spring.datasource.password=${PETGAME_DB_PASSWORD}

# The schema is created in MySQL Workbench from database/schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
